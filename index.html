<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="機步班模擬測驗">
<meta name="description" content="機步班戰鬥教練模擬測驗：單選、複選、排序、計時與自動計分。">
<title>機步班戰鬥教練-模擬測驗</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body><div class="app">
<section id="setup" class="card">
  <div class="hero">
    <div class="heroMark">離線題庫 · 自動計分</div>
    <h1>機步班戰鬥教練-模擬測驗</h1>
    <div class="heroSub">單選、複選與排序題，可隨機出題、限時作答、交卷計分並重考錯題。</div>
  </div>

  <div class="summary">
    <div class="summaryItem"><strong>62</strong>總題數</div>
    <div class="summaryItem"><strong>26</strong>單選題</div>
    <div class="summaryItem"><strong>36</strong>複選／排序</div>
  </div>

  <div class="sectionTitle">測驗設定</div>
  <div class="grid">
    <div class="field">
      <label>出題範圍</label>
      <select id="mode">
        <option value="all">混合（單選＋複選）</option>
        <option value="single">只考單選</option>
        <option value="multi">只考複選／排序</option>
      </select>
    </div>
    <div class="field">
      <label>題數</label>
      <select id="count">
        <option value="all">全部題目</option>
        <option value="20">20 題</option>
        <option value="30">30 題</option>
        <option value="50">50 題</option>
      </select>
    </div>
    <div class="field">
      <label>限時</label>
      <select id="minutes">
        <option value="0">不限時</option>
        <option value="30">30 分鐘</option>
        <option value="45">45 分鐘</option>
        <option value="60">60 分鐘</option>
      </select>
    </div>
    <div class="field">
      <label>題目順序</label>
      <select id="shuffle">
        <option value="1">隨機出題</option>
        <option value="0">依原題號</option>
      </select>
    </div>
  </div>

  <div class="actions setupActions">
    <button class="primary" id="startBtn">開始模擬測驗</button>
  </div>
  <div class="footerTools">
    <button class="subtle" id="clearEdits">重設本機題目文字</button>
  </div>
</section>

<section id="exam" class="card hidden">
 <div class="examTop"><div><b id="counter">第 1 題</b> <span class="pill" id="typePill"></span></div><div class="pill" id="timer">不限時</div></div>
 <div class="progressWrap"><div id="progress" class="progressBar"></div></div>
 <div class="meta"><span id="sourceLabel"></span><span id="answerState"></span></div>
 <div class="questionCard"><div id="qtext" class="questionText"></div></div>
 <div id="hint" class="note"></div>
 <div id="options" class="optionRow"></div>
 <div id="seqArea" class="hidden"><div id="seqBox" class="seqBox"></div><div class="actions"><button id="undoSeq">退回一格</button><button id="clearSeq">清除排序</button></div></div>
 <div class="sourceTools"><button class="ghost" id="editText">編輯題目</button></div>
 <div class="qgrid" id="qgrid"></div>
 <div class="nav"><button id="prevBtn">上一題</button><div class="right"><button id="nextBtn">下一題</button><button class="danger" id="submitBtn">交卷</button></div></div>
</section>

<section id="result" class="card hidden">
 <div class="pill">測驗結果</div><h2 style="margin-top:10px">本次成績</h2><div class="score" id="score">0</div>
 <div class="stats"><div class="stat"><strong class="good" id="correctN">0</strong>答對</div><div class="stat"><strong class="bad" id="wrongN">0</strong>答錯</div><div class="stat"><strong class="warn" id="blankN">0</strong>未答</div></div>
 <div id="resultText" class="sub"></div>
 <div class="actions"><button class="primary" id="retryWrong">重考錯題</button><button id="newExam">重新出題</button></div>
 <h2 style="margin-top:24px">錯題檢討</h2><div id="review"></div>
</section>
</div>

<script src="./questions.js"></script>
<script src="./corrections.js"></script>
<script src="./app.js"></script>
</body>
</html>
